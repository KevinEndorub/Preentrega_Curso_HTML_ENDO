<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>

   <link rel="stylesheet" href="style-form.css">
   <style>  

   </style>
</head>
<body>
        <!--Para abrir y cerrar el formulario -->
        <input type="checkbox" id="toggle-form">
        <label for="toggle-form" class="btn-abrir">Iniciar Sesión</label>

        <div class="modal-overlay">
            <form class="grid-container" action="https://formspree.io/f/xnpnvgbp" method="post" >

                <label for="toggle-form" class="btn-cerrar">X</label>
                <div class="ancho-total titulo">
                    Inicio de Sesión
                </div>

                <div class="ancho-total">
                    <label for="email">Correo electrónico</label>
                    <input type="email" name="email" id="email" required placeholder="ElBarto@gmail.com">
                </div>


                <div class="ancho-total">
                    <label for="contraseña">Contraseña</label>
                    <input type="password" name="contraseña"  id="contraseña" required placeholder="*******">
                </div>


                <div class="ancho-total">
                    <label for="servidores">Servidor</label>
                    <select id="servidores" name="servidor" required>
                        <option value="" disabled selected>Seleccione un servidor</option>
                        <option value="america">América</option>
                        <option value="asia">Asia</option>
                        <option value="china">China</option>
                        <option value="europa">Europa</option>
                    </select>
                </div>


                <div class="ancho-total">
                    <button type="submit" id="enviar">Ingresar</button>
                </div>

                <!-- Fila 6: Botones divididos en 2 columnas -->
                <div class="medio-ancho">
                    <button type="button" class="btn-secundario">Gmail</button>
                </div>

                <div class="medio-ancho">
                    <a class="btn-secundario" href="placeholder.html">Registrarse</a>

                </div>

            </form>
        </div>
</body>
</html>
