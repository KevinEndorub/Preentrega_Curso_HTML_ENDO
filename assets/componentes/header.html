<!-- Modal fuera del header -->
<div class="modal-overlay" id="modal-login" aria-hidden="true">
    <form class="grid-container" id="form-login" action="https://formspree.io/f/xnpnvgbp" method="post">
        <button type="button" id="btn-cerrar-modal" class="btn-cerrar" aria-label="Cerrar modal">X</button>

        <div class="ancho-total titulo">
            Inicio de Sesión
        </div>

        <div class="ancho-total">
            <label for="email">Correo electrónico</label>
            <input type="email" name="email" id="email" required placeholder="ElBarto@gmail.com">
        </div>

        <div class="ancho-total">
            <label for="contraseña">Contraseña</label>
            <input type="password" name="contraseña" id="contraseña" required placeholder="*******">
        </div>

        <div class="ancho-total">
            <label for="servidores">Servidor</label>
            <select id="servidores" name="servidor" required>
                <option value="" disabled selected>Seleccione un servidor</option>
                <option value="america">América</option>
                <option value="asia">Asia</option>
                <option value="china">China</option>
                <option value="europa">Europa</option>
            </select>
        </div>

        <div class="ancho-total">
            <button type="submit" id="enviar">Ingresar</button>
        </div>

        <div class="ancho-total">
            <p id="estado-login"></p>
        </div>

        <div class="medio-ancho">
            <button type="button" class="btn-secundario" id="btn-gmail">Gmail</button>
        </div>

        <div class="medio-ancho">
            <button type="button" class="btn-secundario" id="btn-registrarse">Registrarse</button>
        </div>
    </form>
</div>
